name: Aktualizuj statystyki i opublikuj stronę
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sofron-pack-deploy
  cancel-in-progress: false
jobs:
  stats-and-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zainstaluj biblioteki
        run: python -m pip install requests beautifulsoup4
      - name: Pobierz Modrinth i CurseForge
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: python tools/update_stats.py
      - name: Pobierz statystyki Discord i mediów
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TIKTOK_RESEARCH_ACCESS_TOKEN: ${{ secrets.TIKTOK_RESEARCH_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python -m py_compile tools/update_social_stats.py
          python tools/update_social_stats.py
      - name: Zapisz dane w repozytorium
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stats/sofron-pack.json stats/media.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aktualizacja statystyk Sofron Pack'
            git push
          fi
      - name: Przygotuj pliki strony
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='tools' --exclude='_site' --exclude='__pycache__' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
